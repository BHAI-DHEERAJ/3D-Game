name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build Simple Video Maker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        run: |
          set -e
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
              echo "SDK found at $candidate"
              ls "$candidate"
              break
            fi
          done
          echo "sdkmanager: $(command -v sdkmanager || echo none)"

      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "using $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key
        working-directory: android
        env:
          KS_PASS: simplevideo
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias simplevideo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Simple Video Maker, OU=Personal, O=Personal, L=Panipat, S=Haryana, C=IN"

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: simplevideo
          KS_ALIAS: simplevideo
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors as annotations
        if: failure()
        run: |
          F=android/build.log
          [ -f "$F" ] || { echo "::error::no build.log produced (failure happened before gradle)"; exit 0; }
          grep -E "error:|FAILURE|What went wrong|Caused by|> Task .* FAILED" -A 3 "$F" | tail -60 | while IFS= read -r line; do
            esc="${line//'%'/'%25'}"; esc="${esc//$'\r'/'%0D'}"; esc="${esc//$'\n'/'%0A'}"
            echo "::error::$esc"
          done
          exit 0

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/SimpleVideoMaker-1.0.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVideoMaker-apk
          path: out/SimpleVideoMaker-1.0.apk
          retention-days: 90

      - name: Upload signing keystore (keep it, so future updates install over this one)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: android/keystore.jks
          retention-days: 90

      - name: Publish as a GitHub Release (easy link for the phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Ready-to-install APK. Download, send it to the phone, tap to install."
          if gh release view apk-latest > /dev/null 2>&1; then
            gh release upload apk-latest out/SimpleVideoMaker-1.0.apk --clobber
          else
            gh release create apk-latest out/SimpleVideoMaker-1.0.apk \
              --title "Simple Video Maker — installable APK" \
              --notes "$NOTES" --latest
          fi

      - name: Commit the APK so it is available straight from the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          cp out/SimpleVideoMaker-1.0.apk public/SimpleVideoMaker-1.0.apk
          git add -f public/SimpleVideoMaker-1.0.apk
          git commit -m "build: refresh installable APK [skip ci]" || echo "APK unchanged"
          git push origin "HEAD:${{ github.ref_name }}"
